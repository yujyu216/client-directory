<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>得意先リスト</title>
<style>
:root{
  --bg:#FBF6DE; --card:#FFFDF4; --ink:#3E3A32; --sub:#7A7263;
  --green:#5F7D4F; --green-dk:#47603B; --yellow:#E9C46A; --yellow-soft:#F6E7B8;
  --line:#E7DCB4; --chip:#F3ECD2; --red:#A4442A;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",sans-serif; background:var(--bg); color:var(--ink); padding-bottom:48px}
.bg-rabbit{position:fixed; right:-24px; bottom:-14px; width:250px; opacity:.12; mix-blend-mode:multiply; pointer-events:none; z-index:0}
header{position:relative; z-index:1; padding:16px 14px 4px; display:flex; gap:12px; align-items:center}
.hicon{width:92px; height:auto; border-radius:14px; border:3px solid var(--yellow); background:#fff; flex-shrink:0}
h1{font-size:22px; margin:0}
.sub{font-size:12px; color:var(--sub); margin:3px 0 0}
main{position:relative; z-index:1; padding:10px 14px}
.search{width:100%; font-size:17px; padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:#fff; outline:none}
.search:focus{border-color:var(--green)}
.form{background:var(--card); border:2px solid var(--yellow); border-radius:16px; padding:14px; margin-top:12px; box-shadow:0 2px 8px rgba(120,100,40,.08)}
.form h2{font-size:15px; margin:0 0 10px; color:var(--green-dk)}
.frow{margin-bottom:10px}
.frow label{display:block; font-size:12.5px; font-weight:700; color:var(--sub); margin-bottom:4px}
.frow input, .frow textarea{width:100%; font-size:16.5px; padding:11px 12px; border:2px solid var(--line); border-radius:10px; background:#fff; outline:none; font-family:inherit}
.frow input:focus, .frow textarea:focus{border-color:var(--green)}
.frow textarea{min-height:56px; resize:vertical}
.btnrow{display:flex; gap:8px}
.addbtn{flex:1; padding:14px; font-size:16.5px; font-weight:900; border:none; border-radius:12px; background:var(--green); color:#fff; cursor:pointer}
.cancelbtn{padding:14px 16px; font-size:15px; font-weight:900; border:2px solid var(--line); border-radius:12px; background:#fff; color:var(--sub); cursor:pointer}
.count{font-size:13px; color:var(--sub); margin:16px 2px 8px}
.card{background:var(--card); border:2px solid var(--line); border-left:8px solid var(--yellow); border-radius:14px; padding:12px 14px; margin-bottom:10px; box-shadow:0 2px 6px rgba(120,100,40,.06)}
.cardhead{display:flex; align-items:flex-start; gap:8px}
.store{font-size:18px; font-weight:900; line-height:1.35; flex:1}
.tgl{flex-shrink:0; width:40px; height:40px; font-size:17px; border:2px solid var(--line); border-radius:10px; background:#fff; color:var(--green-dk); cursor:pointer}
.kv{display:flex; gap:8px; font-size:15px; margin-top:7px; line-height:1.5}
.kv .k{flex-shrink:0; font-size:12px; font-weight:900; color:#fff; background:var(--green); border-radius:6px; padding:3px 8px; height:fit-content; margin-top:1px}
.kv .k.mgr{background:#C99A2E}
.kv .v{flex:1; word-break:break-word}
.memo{font-size:13.5px; color:#6B6350; line-height:1.6; margin-top:8px; white-space:pre-wrap; word-break:break-word; background:var(--chip); border-radius:10px; padding:8px 10px}
.cardbtns{display:flex; gap:8px; margin-top:11px}
.editbtn{flex:1; padding:10px; font-size:14px; font-weight:900; border:2px solid var(--green); border-radius:10px; background:#fff; color:var(--green-dk); cursor:pointer}
.delbtn{padding:10px 14px; font-size:14px; font-weight:900; border:2px solid #D8A08E; border-radius:10px; background:#FBEEE9; color:var(--red); cursor:pointer}
.empty{padding:36px 20px; text-align:center; color:var(--sub); font-size:15px; line-height:1.8}
footer{position:relative; z-index:1; padding:6px 16px; font-size:11.5px; color:var(--sub); line-height:1.7}
</style>
</head>

  <div>
    <h1>🏢 得意先リスト</h1>
    <p class="sub">店名・担当者・店長をまとめて管理</p>
  </div>
</header>
<main>
  <input class="search" id="q" type="search" placeholder="店名・担当者・店長で検索">

  <div class="form" id="form">
    <h2 id="form-title">➕ 得意先を追加</h2>
    <div class="frow">
      <label>店名（必須）</label>
      <input id="f-store" type="text" placeholder="例：○○ペットショップ △△店">
    </div>
    <div class="frow">
      <label>担当者</label>
      <input id="f-person" type="text" placeholder="例：山田さん">
    </div>
    <div class="frow">
      <label>店長</label>
      <input id="f-manager" type="text" placeholder="例：佐藤店長">
    </div>
    <div class="frow">
      <label>メモ（任意）</label>
      <textarea id="f-memo" placeholder="例：訪問は火曜が多め／駐車場は裏側 など"></textarea>
    </div>
    <div class="btnrow">
      <button class="addbtn" id="save">追加する</button>
      <button class="cancelbtn" id="cancel" style="display:none">やめる</button>
    </div>
  </div>

  <p class="count" id="count"></p>
  <div id="list"></div>
</main>
<footer>
  データはこの端末のブラウザの中に保存されます（別の端末には移りません）。並び順は店名順です。
</footer>

<script>
const KEY = "clientDirectory_v1";
let items = [];
try{ items = JSON.parse(localStorage.getItem(KEY) || "[]"); if(!Array.isArray(items)) items = []; }catch(e){ items = []; }
let collapsed = new Set();
try{ (JSON.parse(localStorage.getItem("clientDirectory_collapsed_v1") || "[]")).forEach(id=>collapsed.add(id)); }catch(e){}
function saveCollapsed(){ try{ localStorage.setItem("clientDirectory_collapsed_v1", JSON.stringify([...collapsed])); }catch(e){} }
function toggleCard(id){
  if(collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
  saveCollapsed(); render();
}
let editingId = null;
let query = "";
const $ = id => document.getElementById(id);
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function render(){
  const sorted = [...items].sort((a,b)=> a.store.localeCompare(b.store, "ja"));
  const shown = query ? sorted.filter(x => (x.store+x.person+x.manager+(x.memo||"")).includes(query)) : sorted;
  $("count").textContent = items.length + " 件の得意先" + (query ? "（検索結果 " + shown.length + " 件）" : "");
  if(!items.length){
    $("list").innerHTML = '<div class="empty">まだ登録がありません。<br>上のフォームから最初の得意先を追加してください。</div>';
    return;
  }
  if(!shown.length){
    $("list").innerHTML = '<div class="empty">検索に合う得意先がありません。</div>';
    return;
  }
  $("list").innerHTML = shown.map(x=>`
  <div class="card">
    <div class="cardhead">
      <div class="store">${esc(x.store)}</div>
      <button class="tgl" onclick="toggleCard(${x.id})" aria-label="開く・閉じる">${collapsed.has(x.id)?"▸":"▾"}</button>
    </div>
    ${collapsed.has(x.id)?"":`
    ${x.person?`<div class="kv"><span class="k">担当者</span><span class="v">${esc(x.person)}</span></div>`:""}
    ${x.manager?`<div class="kv"><span class="k mgr">店長</span><span class="v">${esc(x.manager)}</span></div>`:""}
    ${x.memo?`<div class="memo">${esc(x.memo)}</div>`:""}
    <div class="cardbtns">
      <button class="editbtn" onclick="startEdit(${x.id})">✏️ 編集</button>
      <button class="delbtn" onclick="removeItem(${x.id})">🗑 削除</button>
    </div>`}
  </div>`).join("");
}
function resetForm(){
  editingId = null;
  $("f-store").value = ""; $("f-person").value = ""; $("f-manager").value = ""; $("f-memo").value = "";
  $("form-title").textContent = "➕ 得意先を追加";
  $("save").textContent = "追加する";
  $("cancel").style.display = "none";
}
function startEdit(id){
  const x = items.find(v=>v.id===id); if(!x) return;
  editingId = id;
  $("f-store").value = x.store; $("f-person").value = x.person; $("f-manager").value = x.manager; $("f-memo").value = x.memo || "";
  $("form-title").textContent = "✏️ 編集：" + x.store;
  $("save").textContent = "上書き保存する";
  $("cancel").style.display = "";
  window.scrollTo({top:0, behavior:"smooth"});
  $("f-store").focus();
}
function removeItem(id){
  const x = items.find(v=>v.id===id); if(!x) return;
  if(!confirm("「" + x.store + "」を削除しますか？")) return;
  items = items.filter(v=>v.id!==id);
  if(editingId===id) resetForm();
  save(); render();
}
$("save").addEventListener("click", ()=>{
  const store = $("f-store").value.trim();
  if(!store){ alert("店名を入れてください"); $("f-store").focus(); return; }
  const data = { store: store, person: $("f-person").value.trim(), manager: $("f-manager").value.trim(), memo: $("f-memo").value.trim() };
  if(editingId){
    const x = items.find(v=>v.id===editingId);
    if(x) Object.assign(x, data);
  }else{
    items.push(Object.assign({id: Date.now()}, data));
  }
  save(); resetForm(); render();
});
$("cancel").addEventListener("click", resetForm);
$("q").addEventListener("input", e=>{ query = e.target.value.trim(); render(); });
render();
</script>
</body>
</html>
